<!DOCTYPE html>
<html lang="ko">
<head>

    <!-- 📱 모바일에서 PC 화면처럼 넓게 보이고 확대/축소가 가능하도록 뷰포트 설정 -->
    <meta name="viewport" content="width=1350, initial-scale=1.0">
    <title>방송 일정표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }

</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between">

        <header class="w-full bg-[#0a0a0a] border-b border-red-900/45 relative overflow-hidden">

                <div class="text-center md:text-left z-10">
                    <h1 class="text-3xl md:text-5xl font-black italic tracking-wider text-white drop-shadow-[0_2px_10px_rgba(255,0,0,0.5)]">
                        DOHYEON <span class="text-red-600">CALENDAR</span>
                    </h1>
                </div>
                <!-- 배너 공식 링크 모음 -->
                <nav class="flex flex-wrap justify-center gap-3 z-10">
                    <a href="https://www.sooplive.com/station/dobby1031" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-lg shadow-red-900/30">SOOP 방송국 ↗</a>
                    <a href="https://www.youtube.com/@d_obby" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-lg font-bold text-sm border border-zinc-700 transition">도튜브 ↗</a>
                    <a href="https://cafe.naver.com/jamdo" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-lg font-bold text-sm border border-zinc-700 transition">도밥천국 ↗</a>

            </div>
            <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-red-900 to-transparent"></div>
        </header>

        <!-- 메인 콘텐츠 (가로 폭 1550px 확장) -->
        <main class="max-w-[1550px] mx-auto px-2 sm:px-4 py-8">
            
            <!-- 범례 및 컨트롤러 바 -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
                <!-- 범례 (순서: 도현방송 -> 타스방송 -> 이벤트 -> 휴방) -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs md:text-sm font-bold">
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-sky-400 inline-block"></span><span>도현방송</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-emerald-400 inline-block"></span><span>타스방송</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-amber-400 inline-block"></span><span>이벤트</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-zinc-400 inline-block"></span><span>휴방</span></div>
                </div>

                <!-- 연도/월 선택 박스 -->
                <div class="flex items-center gap-2">
                    <select id="year-select" onchange="onSelectYearMonth()" class="bg-zinc-800 text-white font-bold px-3 py-1.5 rounded-lg border border-zinc-700 text-sm focus:outline-none focus:border-red-500 cursor-pointer"></select>
                    <select id="month-select" onchange="onSelectYearMonth()" class="bg-zinc-800 text-white font-bold px-3 py-1.5 rounded-lg border border-zinc-700 text-sm focus:outline-none focus:border-red-500 cursor-pointer"></select>
                </div>
            </div>

            <!-- 캘린더 본체 (흰 배경, 양옆 여백 줄이고 내부 가로 공간 극대화) -->
            <div class="bg-white text-zinc-900 rounded-2xl shadow-2xl p-3 md:p-5">
                
                <!-- 상단 네비게이션 (이전달 / 오늘 / 다음달) -->
                <div class="flex justify-between items-center mb-6 px-2">
                    <button onclick="changeMonth(-1)" class="px-3.5 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold transition text-sm cursor-pointer">&lt; 이전달</button>
                    <div class="flex items-center gap-3">
                        <h2 id="calendar-title" class="text-xl md:text-2xl font-black text-zinc-800">2026년 10월</h2>

                    </div>
                    <button onclick="changeMonth(1)" class="px-3.5 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold transition text-sm cursor-pointer">다음달 &gt;</button>
                </div>

                <!-- 요일 헤더 -->
                <div class="grid grid-cols-7 gap-1.5 md:gap-2 text-center font-bold text-zinc-500 text-xs md:text-sm mb-2">
                    <div class="text-red-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-500">토</div>
                </div>

                <!-- 날짜 그리드 -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 md:gap-2"></div>
            </div>
        </main>
    </div>

    <!-- 푸터 -->

        <div class="flex items-center gap-3 shrink-0">
            <!-- 📱 모바일/PC 공용 꾹 누르기(Long Press) 트리거 대상 텍스트 -->
            <span id="admin-long-press-trigger" class="text-zinc-600 font-semibold tracking-wide cursor-pointer select-none">made by 윤슬ツ</span>
        </div>

    <!-- [모달 1] 날짜 클릭 시 상세 팝업 -->

            <h3 id="modal-date-title" class="text-lg font-black text-red-500 mb-2">2026-10-15 일정</h3>

                <!-- 동적 내용 -->

            <div class="flex justify-end gap-2 mt-6">

            </div>

            <!-- 일정 입력 폼 -->
            <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/60 mb-6 space-y-3">
                <h4 id="form-mode-title" class="font-bold text-sm text-zinc-200">일정 추가</h4>
                <input type="hidden" id="edit-target-id" value="">

                <div class="grid grid-cols-2 gap-2">
                    <div>

                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">종료일 (연속 일정시 선택)</label>

                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">방송 종류</label>
                        <select id="form-type" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">

                            <option value="발로">발로</option>
                            <option value="마크">마크</option>
                            <option value="롤">롤</option>
                            <option value="소통">소통</option>
                            <option value="종겜">종겜</option>
                            <option value="옵치">옵치</option>
                            <option value="배그">배그</option>
                            <option value="포나">포나</option>
                        </select>
                    </div>
                </div>

                <!-- 🎨 개별 일정 항목 배경색 프리셋 픽커 -->
                <div>
                    <label class="block text-xs text-zinc-400 mb-1.5">📌 개별 항목 배경색 선택 (강조용 파스텔 픽커)</label>
                    <div class="flex flex-wrap gap-2 items-center" id="color-picker-group">
                        <button type="button" onclick="selectItemColor('default')" data-color-key="default" class="color-btn border-2 border-red-500 bg-zinc-100 text-zinc-800 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-zinc-300 border border-zinc-400 inline-block"></span> 기본(회색)
                        </button>
                        <button type="button" onclick="selectItemColor('yellow')" data-color-key="yellow" class="color-btn border border-zinc-700 bg-amber-100 text-amber-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-amber-200 border border-amber-400 inline-block"></span> 연노랑
                        </button>
                        <button type="button" onclick="selectItemColor('orange')" data-color-key="orange" class="color-btn border border-zinc-700 bg-orange-100 text-orange-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-orange-200 border border-orange-400 inline-block"></span> 연주황
                        </button>
                        <button type="button" onclick="selectItemColor('pink')" data-color-key="pink" class="color-btn border border-zinc-700 bg-pink-100 text-pink-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-pink-200 border border-pink-400 inline-block"></span> 연분홍
                        </button>
                        <button type="button" onclick="selectItemColor('blue')" data-color-key="blue" class="color-btn border border-zinc-700 bg-sky-100 text-sky-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-sky-200 border border-sky-400 inline-block"></span> 연하늘
                        </button>
                        <button type="button" onclick="selectItemColor('green')" data-color-key="green" class="color-btn border border-zinc-700 bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-emerald-200 border border-emerald-400 inline-block"></span> 연연두
                        </button>
                        <button type="button" onclick="selectItemColor('purple')" data-color-key="purple" class="color-btn border border-zinc-700 bg-purple-100 text-purple-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-purple-200 border border-purple-400 inline-block"></span> 연보라
                        </button>
                        <!-- 📌 추가된 연청록(총겜동용) 버튼 -->
                        <button type="button" onclick="selectItemColor('teal')" data-color-key="teal" class="color-btn border border-zinc-700 bg-teal-100 text-teal-900 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
                            <span class="w-3 h-3 rounded-full bg-teal-200 border border-teal-400 inline-block"></span> 연청록
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-zinc-400 mb-1">방송 요약 내용 (선택사항)</label>
                    <input type="text" id="form-summary" placeholder="예: 도현x수피 랜드 합방" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                </div>

                <!-- 📌 하단 강조 문구 입력란 -->
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">📌 하단 강조 문구 (기념일/공지사항 등)</label>
                    <input type="text" id="form-anniversary" placeholder="예: 🎉 BIRTHDAY 🎉, 📢 마이크 고장 - 소리이슈" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                </div>

                <!-- 👥 참여 멤버 세로 길게 여러 줄 입력란 -->
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">👥 참여 멤버 (엔터로 세로 줄바꿈 작성)</label>
                    <textarea id="form-members" rows="4" placeholder="예:&#10;도현 vs 켄&#10;수피 vs 콩석" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500 leading-relaxed"></textarea>
                </div>
                <!-- 📝 상세 설명 분리 입력란 -->
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">📝 상세 설명 (선택사항)</label>
                    <textarea id="form-desc" rows="2" placeholder="예: 멸망전 연습 및 상금 관련 랜드 방송" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="resetForm()" class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 rounded-lg text-xs font-bold transition cursor-pointer">취소/초기화</button>
                    <button onclick="saveSchedule()" id="save-btn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 rounded-lg text-xs font-bold transition cursor-pointer">저장하기</button>

                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-3">
                    <h4 class="font-bold text-sm text-zinc-200">📋 등록된 일정 목록</h4>
                    <!-- 연월 검색 및 필터 컨트롤 바 -->
                    <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                        <select id="admin-filter-year" onchange="renderAdminList()" class="bg-zinc-800 text-xs border border-zinc-700 rounded-md px-2 py-1 focus:outline-none text-zinc-300">
                        </select>
                        <select id="admin-filter-month" onchange="renderAdminList()" class="bg-zinc-800 text-xs border border-zinc-700 rounded-md px-2 py-1 focus:outline-none text-zinc-300">
                            <option value="all">전체 월</option>
                            <option value="0">1월</option>
                            <option value="1">2월</option>
                            <option value="2">3월</option>
                            <option value="3">4월</option>
                            <option value="4">5월</option>
                            <option value="5">6월</option>
                            <option value="6">7월</option>
                            <option value="7">8월</option>
                            <option value="8">9월</option>
                            <option value="9">10월</option>
                            <option value="10">11월</option>
                            <option value="11">12월</option>
                        </select>
                        <select id="admin-filter-sort" onchange="renderAdminList()" class="bg-zinc-800 text-xs border border-zinc-700 rounded-md px-2 py-1 focus:outline-none text-zinc-300">
                            <option value="desc">최신순</option>
                            <option value="asc">과거순</option>
                        </select>
                    </div>
                </div>

                <!-- 키워드 빠른 검색창 -->
                <div class="mb-3">
                    <input type="text" id="admin-search-input" onkeyup="renderAdminList()" placeholder="🔍 내용, 게임, 멤버, 기념일/공지로 검색..." class="w-full bg-zinc-800/80 border border-zinc-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-red-500">
                </div>

                <!-- 일정 리스트 화면 -->
                <div id="admin-schedule-list" class="max-h-60 overflow-y-auto space-y-2 pr-1 text-xs">
                    <!-- 자바스크립트로 로드 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 로드 (Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8gylQ9ETBMTLGN-q0qVcTQgqyM7GpL8Y",
            authDomain: "dohyeon-calander.firebaseapp.com",
            projectId: "dohyeon-calander",
            storageBucket: "dohyeon-calander.firebasestorage.app",
            messagingSenderId: "78037161640",
            appId: "1:78037161640:web:8219d7ee47804f777ad49d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🔑 [관리자 비밀번호 설정]
        const ADMIN_PASSWORD = "1234";

        let schedules = {};

        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); // 0~11

        // 💻 [PC 전용: Alt + A 단축키 리스너]
        document.addEventListener('keydown', function(event) {
            if (event.altKey && (event.key === 'a' || event.key === 'A' || event.key === 'ㅁ')) {
                event.preventDefault(); // 기본 브라우저 동작 방지
                window.openAdminLogin();
            }
        });

        // 📱 [모바일/PC 공용: 꾹 누르기(Long Press) 트리거 로직]
        let pressTimer = null;
        const triggerEl = document.getElementById('admin-long-press-trigger');

        if (triggerEl) {
            const startPress = (e) => {
                pressTimer = setTimeout(() => {
                    window.openAdminLogin();
                }, 1200); // 1.2초 동안 꾹 누르면 관리자 로그인 모달 창 오픈
            };

            const cancelPress = () => {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            };

            triggerEl.addEventListener('touchstart', startPress);
            triggerEl.addEventListener('touchend', cancelPress);
            triggerEl.addEventListener('touchmove', cancelPress);
            
            triggerEl.addEventListener('mousedown', startPress);
            triggerEl.addEventListener('mouseup', cancelPress);
            triggerEl.addEventListener('mouseleave', cancelPress);
        }

        const TYPE_COLORS = {
            solo: '#38bdf8',   // sky-400
            collab: '#34d399', // emerald-400
            event: '#fbbf24',  // amber-400
            rest: '#a1a1aa'    // zinc-400
        };

        const ITEM_COLOR_MAP = {
            default: "bg-zinc-100 text-zinc-800 border-zinc-200/80",
            yellow: "bg-amber-100 text-amber-900 border-amber-300/80",
            orange: "bg-orange-100 text-orange-900 border-orange-300/80",
            pink: "bg-pink-100 text-pink-900 border-pink-300/80",
            blue: "bg-sky-100 text-sky-900 border-sky-300/80",
            green: "bg-emerald-100 text-emerald-900 border-emerald-300/80",
            purple: "bg-purple-100 text-purple-900 border-purple-300/80",
            teal: "bg-teal-100 text-teal-900 border-teal-300/80"
        };

        window.selectItemColor = function(colorKey) {
            document.getElementById('form-item-color').value = colorKey;
            const buttons = document.querySelectorAll('.color-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-color-key') === colorKey) {
                    btn.classList.remove('border-zinc-700');
                    btn.classList.add('border-2', 'border-red-500');
                } else {
                    btn.classList.remove('border-2', 'border-red-500');
                    btn.classList.add('border', 'border-zinc-700');
                }
            });
        }

        function initSelectBoxes() {
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const adminFilterYear = document.getElementById('admin-filter-year');

            yearSelect.innerHTML = '';
            adminFilterYear.innerHTML = '<option value="all">전체 연도</option>';

            for (let y = 2024; y <= today.getFullYear() + 2; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}년`;
                yearSelect.appendChild(opt);

                const optFilter = document.createElement('option');
                optFilter.value = y;
                optFilter.innerText = `${y}년`;
                adminFilterYear.appendChild(optFilter);
            }

            monthSelect.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m - 1;
                opt.innerText = `${m}월`;
                monthSelect.appendChild(opt);
            }
        }

        function updateSelectBoxesUI() {
            document.getElementById('year-select').value = currentYear;
            document.getElementById('month-select').value = currentMonth;
        }

        window.onSelectYearMonth = function() {
            currentYear = parseInt(document.getElementById('year-select').value);
            currentMonth = parseInt(document.getElementById('month-select').value);
            renderCalendar();
        }

        function formatDateStr(year, month, day) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(day).padStart(2, '0');
            return `${year}-${m}-${d}`;
        }

        function renderCalendar() {
            updateSelectBoxesUI();
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            grid.innerHTML = '';

            title.innerText = `${currentYear}년 ${currentMonth + 1}월`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-44 md:h-52 bg-zinc-50/50 rounded-xl border border-transparent";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = formatDateStr(currentYear, currentMonth, day);

                let matchedSchedules = [];
                for (let id in schedules) {
                    const item = schedules[id];
                    const start = item.startDate;
                    const end = item.endDate || item.startDate;

                    if (dateStr >= start && dateStr <= end) {
                        matchedSchedules.push(item);
                    }
                }

                const cell = document.createElement('div');
                let cellBaseClass = "h-44 md:h-52 rounded-xl p-1.5 md:p-2 flex flex-col justify-between transition hover:shadow-md cursor-pointer relative overflow-hidden ";
                
                let bgStyle = "bg-white border border-zinc-200";
                let hasRest = matchedSchedules.some(s => s.type === 'rest');
                
                const uniqueTypes = [...new Set(matchedSchedules.map(s => s.type).filter(t => t && t !== 'none'))];

                cell.removeAttribute('style');

                if (hasRest) {
                    bgStyle = "bg-zinc-200 border border-zinc-300 text-zinc-800";
                } else if (uniqueTypes.length === 1) {
                    const type = uniqueTypes[0];
                    if (type === 'solo') bgStyle = "bg-white border-2 border-sky-400";
                    else if (type === 'collab') bgStyle = "bg-white border-2 border-emerald-400";
                    else if (type === 'event') bgStyle = "bg-white border-2 border-amber-400";
                } else if (uniqueTypes.length > 1) {
                    const colors = uniqueTypes.map(t => TYPE_COLORS[t] || '#38bdf8');
                    bgStyle = "bg-white border-2";

                    if (colors.length === 2) {
                        cell.style.borderColor = `${colors[0]} ${colors[1]} ${colors[1]} ${colors[0]}`;
                    } else if (colors.length === 3) {
                        cell.style.borderColor = `${colors[0]} ${colors[1]} ${colors[2]} ${colors[2]}`;
                    } else {
                        cell.style.borderColor = `${colors[0]} ${colors[1]} ${colors[2]} ${colors[3]}`;
                    }
                }

                cell.className = cellBaseClass + bgStyle;
                cell.onclick = () => window.openDetailModal(dateStr, matchedSchedules);

                const isToday = (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
                
                const topGroup = document.createElement('div');
                topGroup.className = "w-full flex flex-col justify-start overflow-hidden";

                const topHeader = document.createElement('div');
                topHeader.className = "flex items-center gap-1 mb-1.5 flex-wrap";

                const dayNumber = document.createElement('div');
                dayNumber.className = `text-xs md:text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full shrink-0 ${isToday ? 'bg-red-600 text-white' : 'text-zinc-700'}`;
                dayNumber.innerText = day;
                topHeader.appendChild(dayNumber);

                if (matchedSchedules.length > 0) {
                    const uniqueGames = [...new Set(matchedSchedules.map(s => s.game).filter(Boolean))];
                    uniqueGames.forEach(gName => {
                        const gameBadge = document.createElement('span');
                        gameBadge.className = "text-[9.5px] md:text-[10.5px] bg-white text-black font-extrabold px-1 py-0.5 rounded-full border border-black truncate max-w-[80px]";
                        gameBadge.innerText = gName;
                        topHeader.appendChild(gameBadge);
                    });
                }

                topGroup.appendChild(topHeader);

                const listContainer = document.createElement('div');
                listContainer.className = "flex flex-col gap-1 overflow-hidden w-full";

                let validItemCount = 0;
                matchedSchedules.forEach((sch) => {
                    if (sch.summary && sch.summary.trim() !== '') {
                        if (validItemCount < 5) {
                            const badge = document.createElement('div');
                            
                            if (sch.type === 'rest') {
                                badge.className = "text-[10.5px] md:text-[13px] px-2 py-1 rounded bg-transparent text-zinc-800 font-semibold truncate";
                            } else {
                                const customColorStyle = ITEM_COLOR_MAP[sch.color || 'default'] || ITEM_COLOR_MAP['default'];
                                badge.className = `text-[10.5px] md:text-[13px] px-2 py-1 rounded font-semibold truncate border ${customColorStyle}`;
                            }
                            
                            const gamePrefix = sch.game ? `[${sch.game}] ` : '';
                            badge.innerText = `${gamePrefix}${sch.summary}`;
                            listContainer.appendChild(badge);
                        }
                        validItemCount++;
                    }
                });

                if (validItemCount > 5) {
                    const moreBadge = document.createElement('div');
                    moreBadge.className = "text-[9.5px] text-zinc-500 font-bold text-right mt-0.5";
                    moreBadge.innerText = `+${validItemCount - 5}개 더보기`;
                    listContainer.appendChild(moreBadge);
                }

                topGroup.appendChild(listContainer);
                cell.appendChild(topGroup);

                // 📌 해당 날짜에 포함된 모든 하단 강조 문구(anniversary) 추출 및 렌더링
                const allAnniversaries = [];
                matchedSchedules.forEach(s => {
                    if (s.anniversary && s.anniversary.trim() !== '') {
                        allAnniversaries.push(s.anniversary);
                    }
                });

                if (allAnniversaries.length > 0) {
                    const anniFooterContainer = document.createElement('div');
                    anniFooterContainer.className = "w-full pt-1 mt-auto border-t border-zinc-200/60 truncate";
                    allAnniversaries.forEach(anni => {
                        const anniBadge = document.createElement('div');
                        anniBadge.className = "text-[10px] md:text-[11px] font-bold text-red-600 truncate";
                        anniBadge.innerText = anni;
                        anniFooterContainer.appendChild(anniBadge);
                    });
                    cell.appendChild(anniFooterContainer);
                }

                grid.appendChild(cell);
            }
        }

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        window.goToday = function() {
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
        }

        // 모달 관련 함수들
        window.openDetailModal = function(dateStr, matchedSchedules) {
            document.getElementById('modal-date-title').innerText = `${dateStr} 일정`;
            const body = document.getElementById('modal-content-body');
            body.innerHTML = '';

            if (matchedSchedules.length === 0) {
                body.innerHTML = '<p class="text-zinc-500 text-center py-4">등록된 일정이 없습니다.</p>';
            } else {
                matchedSchedules.forEach(s => {
                    const div = document.createElement('div');
                    div.className = "bg-zinc-800/70 p-3 rounded-xl border border-zinc-700/60 space-y-1.5";
                    
                    let typeText = "일반";
                    if (s.type === 'solo') typeText = "도현방송";
                    else if (s.type === 'collab') typeText = "타스방송";
                    else if (s.type === 'event') typeText = "이벤트";
                    else if (s.type === 'rest') typeText = "휴방";

                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-zinc-700 text-zinc-200">${typeText}</span>
                            ${s.game ? `<span class="text-xs font-bold text-red-400">[${s.game}]</span>` : ''}
                        </div>
                        ${s.summary ? `<h4 class="font-bold text-sm text-white">${s.summary}</h4>` : ''}
                        ${s.anniversary ? `<p class="text-xs text-amber-400 font-semibold">${s.anniversary}</p>` : ''}
                        ${s.members ? `<div class="text-xs text-zinc-300 whitespace-pre-line bg-zinc-900/50 p-2 rounded">${s.members}</div>` : ''}
                        ${s.desc ? `<p class="text-xs text-zinc-400">${s.desc}</p>` : ''}
                    `;
                    body.appendChild(div);
                });
            }
            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.remove('flex');
            document.getElementById('detail-modal').classList.add('hidden');
        }

        window.openAdminLogin = function() {
            document.getElementById('admin-pw-input').value = '';
            document.getElementById('admin-login-modal').classList.remove('hidden');
            document.getElementById('admin-login-modal').classList.add('flex');
        }

        window.closeAdminLogin = function() {
            document.getElementById('admin-login-modal').classList.remove('flex');
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        window.verifyAdmin = function() {
            const pw = document.getElementById('admin-pw-input').value;
            if (pw === ADMIN_PASSWORD) {
                closeAdminLogin();
                openAdminPanel();
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
        }

        window.openAdminPanel = function() {
            resetForm();
            renderAdminList();
            document.getElementById('admin-panel-modal').classList.remove('hidden');
            document.getElementById('admin-panel-modal').classList.add('flex');
        }

        window.closeAdminPanel = function() {
            document.getElementById('admin-panel-modal').classList.remove('flex');
            document.getElementById('admin-panel-modal').classList.add('hidden');
        }

        window.resetForm = function() {
            document.getElementById('edit-target-id').value = '';
            document.getElementById('form-start-date').value = formatDateStr(today.getFullYear(), today.getMonth(), today.getDate());
            document.getElementById('form-end-date').value = '';
            document.getElementById('form-type').value = 'solo';
            document.getElementById('form-game').value = '';
            document.getElementById('form-summary').value = '';
            document.getElementById('form-anniversary').value = '';
            document.getElementById('form-members').value = '';
            document.getElementById('form-desc').value = '';
            selectItemColor('default');
            document.getElementById('form-mode-title').innerText = '일정 추가';
            document.getElementById('save-btn').innerText = '저장하기';
        }

        window.saveSchedule = function() {
            const id = document.getElementById('edit-target-id').value || 'sch_' + Date.now();
            const startDate = document.getElementById('form-start-date').value;
            const endDate = document.getElementById('form-end-date').value;
            const type = document.getElementById('form-type').value;
            const game = document.getElementById('form-game').value;
            const color = document.getElementById('form-item-color').value;
            const summary = document.getElementById('form-summary').value;
            const anniversary = document.getElementById('form-anniversary').value;
            const members = document.getElementById('form-members').value;
            const desc = document.getElementById('form-desc').value;

            if (!startDate) {
                alert('시작일을 입력해주세요.');
                return;
            }

            const scheduleData = { startDate, endDate, type, game, color, summary, anniversary, members, desc };

            set(ref(db, 'schedules/' + id), scheduleData).then(() => {
                alert('저장되었습니다.');
                resetForm();
                renderAdminList();
                renderCalendar();
            }).catch((error) => {
                alert('저장 실패: ' + error.message);
            });
        }

        window.renderAdminList = function() {
            const listEl = document.getElementById('admin-schedule-list');
            listEl.innerHTML = '';

            const filterYear = document.getElementById('admin-filter-year').value;
            const filterMonth = document.getElementById('admin-filter-month').value;
            const sortOrder = document.getElementById('admin-filter-sort').value;
            const keyword = document.getElementById('admin-search-input').value.toLowerCase();

            let items = [];
            for (let id in schedules) {
                items.push({ id, ...schedules[id] });
            }

            // 필터링
            items = items.filter(item => {
                const sDate = item.startDate;
                const [y, m, d] = sDate.split('-');

                if (filterYear !== 'all' && y !== filterYear) return false;
                if (filterMonth !== 'all' && parseInt(m) - 1 !== parseInt(filterMonth)) return false;

                if (keyword) {
                    const matchText = `${item.summary} ${item.game} ${item.members} ${item.anniversary} ${item.desc}`.toLowerCase();
                    if (!matchText.includes(keyword)) return false;
                }
                return true;
            });

            // 정렬
            items.sort((a, b) => {
                if (sortOrder === 'desc') {
                    return b.startDate.localeCompare(a.startDate);
                } else {
                    return a.startDate.localeCompare(b.startDate);
                }
            });

            if (items.length === 0) {
                listEl.innerHTML = '<p class="text-zinc-500 text-center py-4">등록된 일정이 없습니다.</p>';
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-zinc-800 p-2.5 rounded-lg border border-zinc-700/60";
                row.innerHTML = `
                    <div class="space-y-0.5 truncate pr-2">
                        <div class="text-[11px] text-zinc-400 font-bold">${item.startDate} ${item.endDate ? '~ ' + item.endDate : ''}</div>
                        <div class="font-bold text-white truncate">${item.summary || '(요약 없음)'}</div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="editSchedule('${item.id}')" class="px-2.5 py-1 bg-zinc-700 hover:bg-zinc-600 text-white rounded text-[11px] font-bold cursor-pointer">수정</button>
                        <button onclick="deleteSchedule('${item.id}')" class="px-2.5 py-1 bg-red-600/80 hover:bg-red-600 text-white rounded text-[11px] font-bold cursor-pointer">삭제</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        window.editSchedule = function(id) {
            const item = schedules[id];
            if (!item) return;

            document.getElementById('edit-target-id').value = id;
            document.getElementById('form-start-date').value = item.startDate || '';
            document.getElementById('form-end-date').value = item.endDate || '';
            document.getElementById('form-type').value = item.type || 'solo';
            document.getElementById('form-game').value = item.game || '';
            selectItemColor(item.color || 'default');
            document.getElementById('form-summary').value = item.summary || '';
            document.getElementById('form-anniversary').value = item.anniversary || '';
            document.getElementById('form-members').value = item.members || '';
            document.getElementById('form-desc').value = item.desc || '';

            document.getElementById('form-mode-title').innerText = '일정 수정';
            document.getElementById('save-btn').innerText = '수정하기';
        }

        window.deleteSchedule = function(id) {
            if (confirm('정말 이 일정을 삭제하시겠습니까?')) {
                remove(ref(db, 'schedules/' + id)).then(() => {
                    alert('삭제되었습니다.');
                    renderAdminList();
                    renderCalendar();
                }).catch((error) => {
                    alert('삭제 실패: ' + error.message);
                });
            }
        }

        // Firebase 데이터 실시간 동기화
        onValue(ref(db, 'schedules'), (snapshot) => {
            const data = snapshot.val();
            schedules = data ? data : {};
            renderCalendar();
            if (!document.getElementById('admin-panel-modal').classList.contains('hidden')) {
                renderAdminList();
            }
        });

        // 초기 실행
        initSelectBoxes();
        resetForm();
    </script>
</body>
</html>
