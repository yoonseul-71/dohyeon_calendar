<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방송 일정표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between">

    <div>
        <!-- 상단 배너 영역 -->
        <header class="w-full bg-[#0a0a0a] border-b border-red-900/45 relative overflow-hidden">
            <div class="max-w-[1400px] mx-auto px-4 py-8 md:py-12 flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="text-center md:text-left z-10">
                    <h1 class="text-3xl md:text-5xl font-black italic tracking-wider text-white drop-shadow-[0_2px_10px_rgba(255,0,0,0.5)]">
                        DOHYEON <span class="text-red-600">CALENDAR</span>
                    </h1>
                </div>
                <!-- 배너 공식 링크 모음 -->
                <nav class="flex flex-wrap justify-center gap-3 z-10">
                    <a href="https://www.sooplive.com/station/dobby1031" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-lg shadow-red-900/30">SOOP 방송국 ↗</a>
                    <a href="https://www.youtube.com/@d_obby" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-lg font-bold text-sm border border-zinc-700 transition">유튜브 ↗</a>
                    <a href="https://cafe.naver.com/jamdo" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-2 rounded-lg font-bold text-sm border border-zinc-700 transition">팬카페 ↗</a>
                </nav>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 via-red-900 to-transparent"></div>
        </header>

        <!-- 메인 콘텐츠 (가로 폭 1400px) -->
        <main class="max-w-[1400px] mx-auto px-4 py-8">
            
            <!-- 범례 및 컨트롤러 바 -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 bg-zinc-900/80 p-4 rounded-xl border border-zinc-800">
                <!-- 범례 -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs md:text-sm font-bold">
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-emerald-400 inline-block"></span><span>합방</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-sky-400 inline-block"></span><span>갠방</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-amber-400 inline-block"></span><span>이벤트</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 rounded-full bg-zinc-400 inline-block"></span><span>휴방</span></div>
                </div>

                <!-- 연도/월 선택 박스 -->
                <div class="flex items-center gap-2">
                    <select id="year-select" onchange="onSelectYearMonth()" class="bg-zinc-800 text-white font-bold px-3 py-1.5 rounded-lg border border-zinc-700 text-sm focus:outline-none focus:border-red-500 cursor-pointer"></select>
                    <select id="month-select" onchange="onSelectYearMonth()" class="bg-zinc-800 text-white font-bold px-3 py-1.5 rounded-lg border border-zinc-700 text-sm focus:outline-none focus:border-red-500 cursor-pointer"></select>
                </div>
            </div>

            <!-- 캘린더 본체 (흰 배경) -->
            <div class="bg-white text-zinc-900 rounded-2xl shadow-2xl p-4 md:p-6">
                
                <!-- 상단 네비게이션 (이전달 / 오늘 / 다음달) -->
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="px-3.5 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold transition text-sm cursor-pointer">&lt; 이전달</button>
                    <div class="flex items-center gap-3">
                        <h2 id="calendar-title" class="text-xl md:text-2xl font-black text-zinc-800">2026년 10월</h2>
                        <button onclick="goToday()" class="px-2.5 py-1 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded-lg text-xs font-bold transition cursor-pointer">오늘</button>
                    </div>
                    <button onclick="changeMonth(1)" class="px-3.5 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold transition text-sm cursor-pointer">다음달 &gt;</button>
                </div>

                <!-- 요일 헤더 -->
                <div class="grid grid-cols-7 gap-1 md:gap-2 text-center font-bold text-zinc-500 text-xs md:text-sm mb-2">
                    <div class="text-red-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-500">토</div>
                </div>

                <!-- 날짜 그리드 -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 md:gap-2"></div>
            </div>
        </main>
    </div>

    <!-- 푸터 -->
    <footer class="max-w-[1400px] mx-auto w-full px-4 py-6 text-zinc-500 text-xs border-t border-zinc-800 mt-12 flex flex-col md:flex-row items-center justify-between gap-4">
        <p class="text-center md:text-left">본 사이트는 비공식 일정표로 스트리머의 상황에 따라 변동될 수 있습니다.</p>
        <div class="flex items-center gap-3">
            <button onclick="openAdminLogin()" class="text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-md text-xs transition cursor-pointer">⚙️ 관리자 모드</button>
            <span class="text-zinc-600 font-semibold tracking-wide">made by 윤슬ツ</span>
        </div>
    </footer>

    <!-- [모달 1] 날짜 클릭 시 상세 및 다시보기 팝업 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 text-white shadow-2xl relative">
            <h3 id="modal-date-title" class="text-lg font-black text-red-500 mb-2">2026-10-15 일정</h3>
            <div id="modal-content-body" class="space-y-4 my-4 text-sm text-zinc-300 max-h-60 overflow-y-auto pr-1">
                <!-- 동적 내용 -->
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeDetailModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-xs font-bold transition cursor-pointer">닫기</button>
            </div>
        </div>
    </div>

    <!-- [모달 2] 관리자 로그인 팝업 -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-6 text-white shadow-2xl">
            <h3 class="text-lg font-bold mb-4">관리자 인증</h3>
            <p class="text-xs text-zinc-400 mb-4">관리자 비밀번호를 입력하세요.</p>
            <input type="password" id="admin-pw-input" placeholder="비밀번호" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-sm mb-4 focus:outline-none focus:border-red-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeAdminLogin()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-xs font-bold transition cursor-pointer">취소</button>
                <button onclick="verifyAdmin()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-xs font-bold transition cursor-pointer">확인</button>
            </div>
        </div>
    </div>

    <!-- [모달 3] 관리자 편집(추가/수정/삭제) 대시보드 팝업 -->
    <div id="admin-panel-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-xl w-full p-6 text-white shadow-2xl my-8">
            <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-3">
                <h3 id="admin-panel-title" class="text-xl font-black text-red-500">🛠️ 일정 관리 패널 (관리자 모드)</h3>
                <button onclick="closeAdminPanel()" class="text-zinc-400 hover:text-white font-bold text-lg cursor-pointer">✕</button>
            </div>

            <!-- 일정 입력 폼 -->
            <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/60 mb-6 space-y-3">
                <h4 id="form-mode-title" class="font-bold text-sm text-zinc-200">일정 추가</h4>
                <input type="hidden" id="edit-target-id" value="">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">시작일</label>
                        <input type="date" id="form-start-date" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">종료일 (연속 일정시 선택)</label>
                        <input type="date" id="form-end-date" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">방송 종류</label>
                        <select id="form-type" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                            <option value="collab">합방</option>
                            <option value="solo">갠방</option>
                            <option value="event">이벤트</option>
                            <option value="rest">휴방</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">게임 / 카테고리</label>
                        <select id="form-game" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                            <option value="">없음</option>
                            <option value="발로">발로</option>
                            <option value="마크">마크</option>
                            <option value="롤">롤</option>
                            <option value="소통">소통</option>
                            <option value="종겜">종겜</option>
                            <option value="옵치">옵치</option>
                            <option value="배그">배그</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">방송 요약 내용 (달력에 표시)</label>
                    <input type="text" id="form-summary" placeholder="예: 도현x수피 랜드 합방" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">상세 설명 / 참여 멤버 등 (선택사항)</label>
                    <textarea id="form-desc" rows="2" placeholder="예: 참여 멤버 - 수피, 도현, 킴성태..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">다시보기 링크 (선택사항, 유튜브/SOOP URL)</label>
                    <input type="text" id="form-link" placeholder="https://..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="resetForm()" class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 rounded-lg text-xs font-bold transition cursor-pointer">취소/초기화</button>
                    <button onclick="saveSchedule()" id="save-btn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 rounded-lg text-xs font-bold transition cursor-pointer">저장하기</button>
                </div>
            </div>

            <!-- 등록된 일정 목록 보기 및 삭제/수정 -->
            <div>
                <h4 class="font-bold text-sm text-zinc-200 mb-2">등록된 전체 일정 목록</h4>
                <div id="admin-schedule-list" class="max-h-48 overflow-y-auto space-y-2 pr-1 text-xs">
                    <!-- 자바스크립트로 로드 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 핵심 로직 스크립트 -->
    <script>
        // 🔑 [관리자 비밀번호 설정] 아래 "1234" 부분을 원하는 비밀번호로 변경하세요!
        const ADMIN_PASSWORD = "dobby1520manager";

        let schedules = JSON.parse(localStorage.getItem('stream_schedules_v2')) || {};

        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); // 0~11

        function initSelectBoxes() {
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');

            yearSelect.innerHTML = '';
            for (let y = 2024; y <= today.getFullYear() + 2; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = `${y}년`;
                yearSelect.appendChild(opt);
            }

            monthSelect.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m - 1;
                opt.innerText = `${m}월`;
                monthSelect.appendChild(opt);
            }
        }

        function updateSelectBoxesUI() {
            document.getElementById('year-select').value = currentYear;
            document.getElementById('month-select').value = currentMonth;
        }

        function onSelectYearMonth() {
            currentYear = parseInt(document.getElementById('year-select').value);
            currentMonth = parseInt(document.getElementById('month-select').value);
            renderCalendar();
        }

        function formatDateStr(year, month, day) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(day).padStart(2, '0');
            return `${year}-${m}-${d}`;
        }

        function renderCalendar() {
            updateSelectBoxesUI();
            const grid = document.getElementById('calendar-grid');
            const title = document.getElementById('calendar-title');
            grid.innerHTML = '';

            title.innerText = `${currentYear}년 ${currentMonth + 1}월`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 이전 달 빈 칸 생성
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-36 md:h-44 bg-zinc-50/50 rounded-xl border border-transparent";
                grid.appendChild(emptyCell);
            }

            // 이번 달 날짜 생성
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = formatDateStr(currentYear, currentMonth, day);

                let matchedSchedules = [];
                for (let id in schedules) {
                    const item = schedules[id];
                    const start = item.startDate;
                    const end = item.endDate || item.startDate;

                    if (dateStr >= start && dateStr <= end) {
                        matchedSchedules.push(item);
                    }
                }

                const cell = document.createElement('div');
                let cellBaseClass = "h-36 md:h-44 border rounded-xl p-1.5 md:p-2 flex flex-col justify-start transition hover:shadow-md cursor-pointer relative overflow-hidden ";
                
                let bgStyle = "bg-white border-zinc-200";
                let hasRest = matchedSchedules.some(s => s.type === 'rest');
                let hasActive = matchedSchedules.length > 0;

                if (hasRest) {
                    bgStyle = "bg-zinc-200 border-zinc-300 text-zinc-800"; // 휴방인 날은 전체 회색
                } else if (hasActive) {
                    const firstType = matchedSchedules[0].type;
                    if (firstType === 'collab') bgStyle = "bg-white border-2 border-emerald-400";
                    else if (firstType === 'solo') bgStyle = "bg-white border-2 border-sky-400";
                    else if (firstType === 'event') bgStyle = "bg-white border-2 border-amber-400";
                }

                cell.className = cellBaseClass + bgStyle;
                cell.onclick = () => openDetailModal(dateStr, matchedSchedules);

                const isToday = (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
                
                // 상단 영역 (날짜 숫자 + 검정색/흰색 스타일 게임 카테고리 태그)
                const topHeader = document.createElement('div');
                topHeader.className = "flex items-center gap-1.5 mb-1.5 flex-wrap";

                const dayNumber = document.createElement('div');
                dayNumber.className = `text-xs md:text-sm font-bold w-6 h-6 flex items-center justify-center rounded-full shrink-0 ${isToday ? 'bg-red-600 text-white' : 'text-zinc-700'}`;
                dayNumber.innerText = day;
                topHeader.appendChild(dayNumber);

                // 첫 번째 일정에 카테고리가 등록되어 있을 때 날짜 옆에 검정 글씨, 흰 배경, 검정 테두리 태그로 표시
                if (matchedSchedules.length > 0 && matchedSchedules[0].game) {
                    const gameBadge = document.createElement('span');
                    gameBadge.className = "text-[9px] md:text-[10px] bg-white text-black font-extrabold px-1.5 py-0.5 rounded-full border border-black truncate max-w-[80px]";
                    gameBadge.innerText = matchedSchedules[0].game;
                    topHeader.appendChild(gameBadge);
                }

                cell.appendChild(topHeader);

                // 내부 일정 목록
                const listContainer = document.createElement('div');
                listContainer.className = "flex flex-col gap-1 overflow-hidden w-full";

                matchedSchedules.forEach((sch, idx) => {
                    if (idx < 3) {
                        const badge = document.createElement('div');
                        badge.className = "text-[10px] md:text-xs px-2 py-1 rounded bg-zinc-100 text-zinc-800 font-semibold truncate border border-zinc-200/80";
                        
                        const gamePrefix = sch.game ? `[${sch.game}] ` : '';
                        badge.innerText = `${gamePrefix}${sch.summary}`;
                        listContainer.appendChild(badge);
                    }
                });

                if (matchedSchedules.length > 3) {
                    const moreBadge = document.createElement('div');
                    moreBadge.className = "text-[9px] text-zinc-500 font-bold text-right mt-0.5";
                    moreBadge.innerText = `+${matchedSchedules.length - 3}개 더보기`;
                    listContainer.appendChild(moreBadge);
                }

                cell.appendChild(listContainer);
                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            if (currentYear < 2024 || (currentYear === 2024 && currentMonth < 7)) {
                currentYear = 2024;
                currentMonth = 7;
            }
            renderCalendar();
        }

        function goToday() {
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
        }

        function openDetailModal(dateStr, schedulesList) {
            const modal = document.getElementById('detail-modal');
            const titleEl = document.getElementById('modal-date-title');
            const bodyEl = document.getElementById('modal-content-body');

            titleEl.innerText = `${dateStr} 방송 일정`;

            if (schedulesList && schedulesList.length > 0) {
                let html = "";
                schedulesList.forEach((sch) => {
                    let typeText = "";
                    if (sch.type === 'collab') typeText = "🟢 합방";
                    else if (sch.type === 'solo') typeText = "🔵 갠방";
                    else if (sch.type === 'event') typeText = "🟡 이벤트";
                    else if (sch.type === 'rest') typeText = "⚪ 휴방";

                    let gameText = sch.game ? `<span class="bg-white text-black border border-black px-2 py-0.5 rounded text-xs ml-2 font-bold">${sch.game}</span>` : '';
                    let periodText = sch.endDate && sch.endDate !== sch.startDate ? `<p class="text-xs text-zinc-400 mt-1">기간: ${sch.startDate} ~ ${sch.endDate}</p>` : '';
                    let descText = sch.desc ? `<p class="mt-2 text-zinc-200 bg-zinc-800/80 p-2.5 rounded-lg text-xs whitespace-pre-wrap border border-zinc-700/50"><strong>상세/멤버:</strong><br>${sch.desc}</p>` : '';
                    let linkText = sch.link ? `<p class="mt-2"><a href="${sch.link}" target="_blank" class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">📺 다시보기 / 관련 링크 ↗</a></p>` : '';

                    html += `
                        <div class="border-b border-zinc-800 pb-3 mb-3 last:border-b-0 last:pb-0 last:mb-0">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-white">${typeText} ${gameText}</span>
                            </div>
                            <p class="font-bold text-sm mt-1.5 text-white">${sch.summary}</p>
                            ${periodText}
                            ${descText}
                            ${linkText}
                        </div>
                    `;
                });
                bodyEl.innerHTML = html;
            } else {
                bodyEl.innerHTML = `<p class="text-zinc-400 py-4 text-center">이 날은 등록된 방송 일정이 없습니다.</p>`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function openAdminLogin() {
            document.getElementById('admin-pw-input').value = '';
            const modal = document.getElementById('admin-login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAdminLogin() {
            const modal = document.getElementById('admin-login-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function verifyAdmin() {
            const pw = document.getElementById('admin-pw-input').value;
            if (pw === ADMIN_PASSWORD) { 
                closeAdminLogin();
                openAdminPanel();
            } else {
                alert('비밀번호가 틀렸습니다!');
            }
        }

        function openAdminPanel() {
            resetForm();
            renderAdminList();
            const modal = document.getElementById('admin-panel-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAdminPanel() {
            const modal = document.getElementById('admin-panel-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            renderCalendar(); 
        }

        function resetForm() {
            document.getElementById('edit-target-id').value = '';
            document.getElementById('form-start-date').value = '';
            document.getElementById('form-end-date').value = '';
            document.getElementById('form-type').value = 'collab';
            document.getElementById('form-game').value = '';
            document.getElementById('form-summary').value = '';
            document.getElementById('form-desc').value = '';
            document.getElementById('form-link').value = '';
            document.getElementById('form-mode-title').innerText = '일정 추가';
            document.getElementById('save-btn').innerText = '저장하기';
        }

        function saveSchedule() {
            const editId = document.getElementById('edit-target-id').value;
            const startDate = document.getElementById('form-start-date').value;
            const endDate = document.getElementById('form-end-date').value || startDate;
            const type = document.getElementById('form-type').value;
            const game = document.getElementById('form-game').value;
            const summary = document.getElementById('form-summary').value;
            const desc = document.getElementById('form-desc').value;
            const link = document.getElementById('form-link').value;

            if (!startDate || !summary) {
                alert('시작일과 방송 요약은 필수 입력 항목입니다!');
                return;
            }

            if (startDate > endDate) {
                alert('종료일은 시작일보다 빠를 수 없습니다!');
                return;
            }

            const scheduleId = editId ? editId : 'sch_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

            schedules[scheduleId] = { startDate, endDate, type, game, summary, desc, link };
            localStorage.setItem('stream_schedules_v2', JSON.stringify(schedules));
            
            alert(editId ? '일정이 성공적으로 수정되었습니다!' : '일정이 성공적으로 추가되었습니다!');
            resetForm();
            renderAdminList();
            renderCalendar(); 
        }

        function editSchedule(id) {
            const item = schedules[id];
            if (!item) return;

            document.getElementById('edit-target-id').value = id;
            document.getElementById('form-start-date').value = item.startDate;
            document.getElementById('form-end-date').value = item.endDate || item.startDate;
            document.getElementById('form-type').value = item.type;
            document.getElementById('form-game').value = item.game || '';
            document.getElementById('form-summary').value = item.summary;
            document.getElementById('form-desc').value = item.desc || '';
            document.getElementById('form-link').value = item.link || '';
            
            document.getElementById('form-mode-title').innerText = '일정 수정 중...';
            document.getElementById('save-btn').innerText = '수정 완료하기';
            
            document.getElementById('admin-panel-modal').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteSchedule(id) {
            if (confirm('해당 일정을 삭제하시겠습니까?')) {
                delete schedules[id];
                localStorage.setItem('stream_schedules_v2', JSON.stringify(schedules));
                renderAdminList();
                renderCalendar(); 
            }
        }

        function renderAdminList() {
            const listContainer = document.getElementById('admin-schedule-list');
            listContainer.innerHTML = '';

            const keys = Object.keys(schedules).sort((a, b) => {
                return schedules[b].startDate.localeCompare(schedules[a].startDate);
            });

            if (keys.length === 0) {
                listContainer.innerHTML = `<p class="text-zinc-500 text-center py-4">등록된 일정이 없습니다.</p>`;
                return;
            }

            keys.forEach(id => {
                const item = schedules[id];
                const dateDisplay = item.endDate && item.endDate !== item.startDate ? `${item.startDate} ~ ${item.endDate}` : item.startDate;
                const gameTag = item.game ? `[${item.game}] ` : '';

                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-zinc-800 p-2.5 rounded-xl border border-zinc-700";
                row.innerHTML = `
                    <div class="overflow-hidden pr-2">
                        <span class="font-bold text-red-400 mr-2">[${dateDisplay}]</span>
                        <span class="text-zinc-200 truncate">${gameTag}${item.summary}</span>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                        <button onclick="editSchedule('${id}')" class="bg-sky-900/50 hover:bg-sky-700 text-sky-300 px-2.5 py-1 rounded-lg text-[11px] transition cursor-pointer">수정</button>
                        <button onclick="deleteSchedule('${id}')" class="bg-red-900/40 hover:bg-red-700 text-red-300 px-2.5 py-1 rounded-lg text-[11px] transition cursor-pointer">삭제</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        // 초기 화면 실행
        initSelectBoxes();
        renderCalendar();
    </script>
</body>
</html>
